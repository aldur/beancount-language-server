[workspace]
members = [
    "crates/lsp",
]
resolver = "2"

[workspace.package]
version = "1.9.2"
edition = "2024"
rust-version = "1.92.0"

[workspace.dependencies]
# Core functionality
anyhow = "1.0"
thiserror = "2.0"
tracing = "0.1"

# LSP and server functionality
lsp-server = "=0.7.9" # Pinned due to Dependabot updater bug
lsp-types = { package = "gen-lsp-types", version = "0.5.0", features = ["url"] }
crossbeam-channel = "0.5"

# Text processing
# default-features drops unicode_lines/cr_lines: ropey would otherwise count
# NEL/VT/FF/U+2028/U+2029 (and lone \r) as line breaks, while editors treat
# them as ordinary characters on the line — one such character in a narration
# and every position the client sends afterwards lands one line off.
ropey = { version = "1.6", default-features = false, features = ["simd"] }
libc = "0.2"
regex = "1.12"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Testing
insta = { version = "1.47", features = ["yaml"] }

[workspace.metadata.crane]
name = "beancount-language-server-workspace"

# The profile that 'cargo dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
